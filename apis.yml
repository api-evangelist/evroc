name: evroc
description: >-
  evroc is a European sovereign cloud provider headquartered in Stockholm, Sweden, building
  cloud infrastructure for the AI era for organizations that require the highest level of data
  security and European data residency. Its platform spans Compute (virtual machines, disks,
  snapshots, placement groups), Networking (VPCs, subnets, public IPs, security groups, IPv6,
  load balancers), Storage (S3-compatible object storage and file store), IAM (organizations,
  projects, service accounts, and a fine-grained RoleBindings permission system), Quotas, and
  Think (shared and dedicated AI-model inference). Developers reach the platform through a web
  console, a REST API with Bearer/OIDC access tokens, an official Go SDK, a Terraform provider,
  a Kubernetes CSI driver, and the evroc CLI. The company emphasizes European sovereignty,
  sustainability, and security, operating from the Stockholm (se-sto) region.
